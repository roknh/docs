<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <title>Kết quả kỳ thi — Catcuri LMS</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="layout-quiz">

  <!-- Quiz Header -->
  <header class="quiz-header">
    <div class="body-emphasis">Kỳ thi đánh giá năng lực Q2/2026</div>
    <div></div>
    <a href="exam-detail.html" class="btn btn-ghost btn-sm">Đóng ✕</a>
  </header>

  <!-- Quiz Result -->
  <main class="quiz-content">
    <div class="quiz-result">

      <div class="result-icon" style="color: var(--error);">✕</div>

      <div class="result-title">Chưa đạt</div>

      <div class="result-score">24 / 30 câu đúng</div>

      <div style="margin-bottom: var(--sp-xl);">
        <div class="progress" style="height: 12px; max-width: 320px; margin: 0 auto var(--sp-xs);">
          <div class="progress-bar" style="width: 80%; background: var(--error);"></div>
        </div>
        <div class="caption text-muted">Điểm đạt: 80% — Ngưỡng đạt: 100%</div>
      </div>

      <div class="flex flex-center gap-md" style="justify-content: center; flex-wrap: wrap; margin-bottom: var(--sp-xl);">
        <a href="exam-quiz.html" class="btn btn-ghost">Xem lại bài</a>
        <a href="exam-quiz.html" class="btn btn-primary">Làm lại</a>
      </div>

      <!-- Additional Info Card -->
      <div class="card" style="max-width: 360px; margin: 0 auto; text-align: left;">
        <div class="flex" style="justify-content: space-between; padding: var(--sp-sm) 0; border-bottom: 1px solid var(--border);">
          <span class="caption text-muted">Lần thi</span>
          <span class="body-emphasis">3 / Không giới hạn</span>
        </div>
        <div class="flex" style="justify-content: space-between; padding: var(--sp-sm) 0;">
          <span class="caption text-muted">Thời gian làm bài</span>
          <span class="body-emphasis">38 phút / 45 phút</span>
        </div>
      </div>

    </div>
  </main>

</div>
<script src="../js/app.js"></script>
</body>
</html>
