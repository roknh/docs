<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <title>Kỳ thi đánh giá năng lực Q2/2026 — Catcuri LMS</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="layout-quiz">

  <!-- Quiz Header -->
  <header class="quiz-header">
    <div class="body-emphasis">Kỳ thi đánh giá năng lực Q2/2026</div>
    <div class="quiz-timer">12:45</div>
    <a href="exam-result.html" class="btn btn-primary btn-sm">Nộp bài</a>
  </header>

  <!-- Quiz Content -->
  <main class="quiz-content">

    <div class="quiz-question">
      <div class="question-number">CÂU 5 / 30</div>
      <div class="question-text">
        Khi phát hiện có sự cố cháy nổ tại nơi làm việc, hành động đầu tiên cần thực hiện là gì?
      </div>

      <div class="quiz-answers">

        <div class="quiz-answer">
          <input type="radio" name="q5" id="a1" />
          <label for="a1" style="cursor: pointer; flex: 1; font-size: 14px;">Cố gắng dập lửa bằng bình chữa cháy</label>
        </div>

        <div class="quiz-answer">
          <input type="radio" name="q5" id="a2" />
          <label for="a2" style="cursor: pointer; flex: 1; font-size: 14px;">Báo cho quản lý trực tiếp</label>
        </div>

        <div class="quiz-answer selected">
          <input type="radio" name="q5" id="a3" checked />
          <label for="a3" style="cursor: pointer; flex: 1; font-size: 14px;">Nhấn chuông báo cháy và di chuyển đến lối thoát hiểm</label>
        </div>

        <div class="quiz-answer">
          <input type="radio" name="q5" id="a4" />
          <label for="a4" style="cursor: pointer; flex: 1; font-size: 14px;">Gọi điện cho lực lượng cứu hỏa</label>
        </div>

      </div>
    </div>

    <!-- Quiz Nav -->
    <div class="quiz-nav">
      <button class="btn btn-tertiary btn-sm">← Câu trước</button>
      <div class="quiz-dots">
        <div class="quiz-dot answered" title="Câu 1"></div>
        <div class="quiz-dot answered" title="Câu 2"></div>
        <div class="quiz-dot answered" title="Câu 3"></div>
        <div class="quiz-dot answered" title="Câu 4"></div>
        <div class="quiz-dot current answered" title="Câu 5"></div>
        <div class="quiz-dot-separator">...</div>
        <div class="quiz-dot" title="Câu 30"></div>
      </div>
      <a href="exam-result.html" class="btn btn-primary btn-sm">Câu tiếp →</a>
    </div>

  </main>

</div>
<script src="../js/app.js"></script>
</body>
</html>
