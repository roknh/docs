<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <title>Kết quả bài kiểm tra — Catcuri LMS</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="layout-quiz">

  <!-- Quiz Header -->
  <header class="quiz-header">
    <div class="body-emphasis">Bài kiểm tra Chương 1</div>
    <div></div>
    <a href="course-detail.html" class="btn btn-ghost btn-sm">Đóng ✕</a>
  </header>

  <!-- Quiz Result -->
  <main class="quiz-content">
    <div class="quiz-result">

      <div class="result-icon" style="color: var(--success);">✓</div>

      <div class="result-title">Chúc mừng! Bạn đã đạt</div>

      <div class="result-score">5 / 5 câu đúng</div>

      <div style="margin-bottom: var(--sp-xl);">
        <div class="progress" style="height: 12px; max-width: 320px; margin: 0 auto var(--sp-xs);">
          <div class="progress-bar success" style="width: 100%;"></div>
        </div>
        <div class="caption text-muted">Điểm đạt: 100% — Ngưỡng đạt: 70%</div>
      </div>

      <div class="flex flex-center gap-md" style="justify-content: center; flex-wrap: wrap;">
        <a href="quiz.html" class="btn btn-ghost">Xem lại bài</a>
        <a href="learning.html" class="btn btn-primary">Tiếp tục học</a>
      </div>

    </div>
  </main>

</div>
<script src="../js/app.js"></script>
</body>
</html>
