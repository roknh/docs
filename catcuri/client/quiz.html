<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <title>Bài kiểm tra — Catcuri LMS</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="layout-quiz">

  <!-- Quiz Header -->
  <header class="quiz-header">
    <div class="body-emphasis">Bài kiểm tra Chương 1</div>
    <div class="quiz-timer">04:32</div>
    <a href="quiz-result.html" class="btn btn-primary btn-sm">Nộp bài</a>
  </header>

  <!-- Quiz Content -->
  <main class="quiz-content">

    <div class="quiz-question">
      <div class="question-number">CÂU 3 / 5</div>
      <div class="question-text">
        Trong giao tiếp, ngôn ngữ cơ thể chiếm bao nhiêu phần trăm trong việc truyền đạt thông điệp?
      </div>

      <div class="quiz-answers">

        <div class="quiz-answer">
          <input type="radio" name="q3" id="a1" />
          <label for="a1" style="cursor: pointer; flex: 1; font-size: 14px;">7%</label>
        </div>

        <div class="quiz-answer">
          <input type="radio" name="q3" id="a2" />
          <label for="a2" style="cursor: pointer; flex: 1; font-size: 14px;">38%</label>
        </div>

        <div class="quiz-answer selected">
          <input type="radio" name="q3" id="a3" checked />
          <label for="a3" style="cursor: pointer; flex: 1; font-size: 14px;">55%</label>
        </div>

        <div class="quiz-answer">
          <input type="radio" name="q3" id="a4" />
          <label for="a4" style="cursor: pointer; flex: 1; font-size: 14px;">70%</label>
        </div>

      </div>
    </div>

    <!-- Quiz Nav -->
    <div class="quiz-nav">
      <button class="btn btn-tertiary btn-sm">← Câu trước</button>
      <div class="quiz-dots">
        <div class="quiz-dot answered" title="Câu 1"></div>
        <div class="quiz-dot answered" title="Câu 2"></div>
        <div class="quiz-dot current answered" title="Câu 3"></div>
        <div class="quiz-dot" title="Câu 4"></div>
        <div class="quiz-dot" title="Câu 5"></div>
      </div>
      <a href="quiz-result.html" class="btn btn-primary btn-sm">Câu tiếp →</a>
    </div>

  </main>

</div>
<script src="../js/app.js"></script>
</body>
</html>
