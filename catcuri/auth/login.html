<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <title>Đăng nhập — Catcuri LMS</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="layout-default">

  <div class="auth-logo"><img src="../images/logo.png" alt="Catcuri"></div>

  <div class="auth-card">
    <h2>Đăng nhập</h2>

    <form>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" name="email" placeholder="ten@congty.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu</label>
        <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <div class="mb-lg text-right">
        <a href="forgot-password.html" class="body-sm">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Đăng nhập</button>
    </form>

    <div class="auth-footer">
      Chưa có tài khoản? <a href="register.html">Đăng ký</a>
    </div>
  </div>

  <div class="mt-xl caption text-muted text-center">
    &copy; 2026 Catcuri LMS. Mọi quyền được bảo lưu.
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
