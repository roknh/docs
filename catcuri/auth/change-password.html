<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <title>Đổi mật khẩu — Catcuri LMS</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="layout-default">

  <div class="auth-logo"><img src="../images/logo.png" alt="Catcuri"></div>

  <div class="auth-card">
    <h2>Đổi mật khẩu lần đầu</h2>

    <div class="card mb-lg" style="background: #fdf0cc; border-color: var(--warning); padding: var(--sp-md);">
      <p class="body-sm" style="color: #8e6a00;">
        Bạn cần đổi mật khẩu trước khi sử dụng hệ thống. Vui lòng tạo mật khẩu mới để tiếp tục.
      </p>
    </div>

    <form>
      <div class="form-group">
        <label class="form-label" for="new-password">Mật khẩu mới</label>
        <input class="form-input" type="password" id="new-password" name="new_password" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password">
        <p class="form-helper">Tối thiểu 8 ký tự, bao gồm chữ hoa, chữ thường và số.</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">Xác nhận mật khẩu mới</label>
        <input class="form-input" type="password" id="confirm-password" name="confirm_password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary btn-full">Đặt mật khẩu mới</button>
    </form>
  </div>

  <div class="mt-xl caption text-muted text-center">
    &copy; 2026 Catcuri LMS. Mọi quyền được bảo lưu.
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
