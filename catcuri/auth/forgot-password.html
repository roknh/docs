<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <title>Quên mật khẩu — Catcuri LMS</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="layout-default">

  <div class="auth-logo"><img src="../images/logo.png" alt="Catcuri"></div>

  <div class="auth-card">
    <h2>Quên mật khẩu</h2>
    <p class="body-sm text-muted mb-lg">Nhập email của bạn để nhận mã OTP đặt lại mật khẩu.</p>

    <form>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" name="email" placeholder="ten@congty.com" autocomplete="email">
        <p class="form-helper">Mã OTP sẽ được gửi đến địa chỉ email này.</p>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Gửi mã OTP</button>
    </form>

    <div class="auth-footer">
      <a href="login.html">&larr; Quay lại đăng nhập</a>
    </div>
  </div>

  <div class="mt-xl caption text-muted text-center">
    &copy; 2026 Catcuri LMS. Mọi quyền được bảo lưu.
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
