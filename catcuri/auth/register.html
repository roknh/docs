<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <title>Đăng ký — Catcuri LMS</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .step-indicator {
      display: flex;
      align-items: center;
      margin-bottom: var(--sp-xl);
    }
    .step {
      display: flex;
      align-items: center;
      gap: var(--sp-xs);
      font-size: 12px;
      color: var(--ink-subtle);
      letter-spacing: 0.32px;
    }
    .step.active { color: var(--primary); font-weight: 600; }
    .step.done { color: var(--success); }
    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--ink-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .step.active .step-num { background: var(--primary); color: var(--on-primary); }
    .step.done .step-num { background: var(--success); color: var(--on-primary); }
    .step-divider {
      flex: 1;
      height: 1px;
      background: var(--surface-2);
      margin: 0 var(--sp-xs);
    }
  </style>
</head>
<body class="layout-default">

  <div class="auth-logo"><img src="../images/logo.png" alt="Catcuri"></div>

  <div class="auth-card">
    <h2>Tạo tài khoản</h2>

    <!-- Step Indicator -->
    <div class="step-indicator">
      <div class="step active">
        <span class="step-num">1</span>
        <span>Nhập email</span>
      </div>
      <div class="step-divider"></div>
      <div class="step">
        <span class="step-num">2</span>
        <span>Xác thực OTP</span>
      </div>
      <div class="step-divider"></div>
      <div class="step">
        <span class="step-num">3</span>
        <span>Tạo mật khẩu</span>
      </div>
    </div>

    <!-- Step 1: Email -->
    <form id="step-email">
      <div class="form-group">
        <label class="form-label" for="email">Địa chỉ email</label>
        <input class="form-input" type="email" id="email" name="email" placeholder="ten@congty.com" autocomplete="email">
        <p class="form-helper">Nhập email công ty của bạn để nhận mã OTP xác thực.</p>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Gửi mã OTP</button>
    </form>

    <div class="auth-footer">
      Đã có tài khoản? <a href="login.html">Đăng nhập</a>
    </div>
  </div>

  <div class="mt-xl caption text-muted text-center">
    &copy; 2026 Catcuri LMS. Mọi quyền được bảo lưu.
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
