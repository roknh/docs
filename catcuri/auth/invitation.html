<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <title>Lời mời tham gia — Catcuri LMS</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .invite-tenant-card {
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      padding: var(--sp-md) var(--sp-lg);
      background: var(--canvas);
      border: 1px solid var(--hairline);
      margin-bottom: var(--sp-lg);
    }
    .invite-org-icon {
      width: 56px;
      height: 56px;
      background: var(--primary);
      color: var(--on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .invite-org-info { flex: 1; }
    .invite-org-name { font-size: 20px; font-weight: 400; margin-bottom: var(--sp-xxs); }
    .invite-org-meta { font-size: 12px; color: var(--ink-muted); }
    .invite-by {
      padding: var(--sp-md);
      background: var(--surface-1);
      border-left: 3px solid var(--primary);
      margin-bottom: var(--sp-xl);
      font-size: 14px;
      color: var(--ink-muted);
    }
    .invite-by strong { color: var(--ink); }
    .btn-group {
      display: flex;
      gap: var(--sp-xs);
    }
  </style>
</head>
<body class="layout-default">

  <div class="auth-logo"><img src="../images/logo.png" alt="Catcuri"></div>

  <div class="auth-card">
    <h2>Bạn được mời tham gia</h2>
    <p class="body-sm text-muted mb-lg">Bạn có lời mời tham gia vào tổ chức bên dưới trên Catcuri LMS.</p>

    <!-- Tenant Info -->
    <div class="invite-tenant-card">
      <div class="invite-org-icon">ND</div>
      <div class="invite-org-info">
        <div class="invite-org-name">Ngọc Dung Group</div>
        <div class="invite-org-meta">&#128100; 245 nhân viên &nbsp;&bull;&nbsp; &#128218; 18 khóa học</div>
      </div>
    </div>

    <!-- Invited By -->
    <div class="invite-by">
      Được mời bởi: <strong>admin@ngocdung.com</strong>
    </div>

    <!-- Actions -->
    <div class="btn-group">
      <button type="button" class="btn btn-primary" style="flex: 1;">Chấp nhận</button>
      <button type="button" class="btn btn-ghost" style="flex: 1;">Từ chối</button>
    </div>

    <div class="auth-footer">
      <a href="login.html">&larr; Quay lại đăng nhập</a>
    </div>
  </div>

  <div class="mt-xl caption text-muted text-center">
    &copy; 2026 Catcuri LMS. Mọi quyền được bảo lưu.
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
